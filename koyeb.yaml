# Koyeb deploy: koyeb app init dark-eyes --git github.com/Darkeye-devs/Darkeye_md_bots --git-branch main
name: dark-eyes
services:
  - name: dark-eyes-bot
    type: web
    instance_types:
      - type: free
    git:
      repository: github.com/Darkeye-devs/Darkeye_md_bots
      branch: main
    build:
      buildpack:
        build_command: npm install
    run:
      command: node src/index.js
    ports:
      - port: 8000
        protocol: http
    health_checks:
      - grace_period: 30
        interval: 30
        restart_limit: 5
        timeout: 10
        tcp:
          port: 8000
    env:
      - key: PORT
        value: "8000"
      - key: NODE_ENV
        value: production
      - key: SESSION_ID
        value: ""
      - key: OWNER_NUMBER
        value: ""
